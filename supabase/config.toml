# SF Semijoias — Supabase production
# A integracao GitHub aplica este arquivo a cada deploy de main.
# URL publica temporaria para testes; atualizar ao migrar para hospedagem comercial.
[remotes.production]
project_id = "lydxjkgnlvqmezjhzxhl"

# Evitar que os defaults locais (127.0.0.1) sobrescrevam Auth de producao.
[remotes.production.auth]
site_url = "https://fergoula-source.github.io/sf-semijoias/"
additional_redirect_urls = [
  "https://fergoula-source.github.io/sf-semijoias/",
  "https://fergoula-source.github.io/sf-semijoias/**"
]
enable_signup = true

[remotes.production.auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 8

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.create-checkout]
verify_jwt = false

[functions.mercadopago-webhook]
verify_jwt = false
